[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dat158-footballpredictor"
version = "1.0.0"
description = "Leakage-safe Premier League match outcome predictor"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["football_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
